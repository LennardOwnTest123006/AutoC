name: CI
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      AUTOC_NO_GUI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Selftest from source (real keyboard hook + real typing)
        run: python -m autoc selftest --e2e
        timeout-minutes: 3
      - name: Build
        run: pyinstaller autoc.spec
      - name: Packaged console exe corrects text (checks the real output)
        shell: pwsh
        run: |
          $out = & .\dist\AutoC\autoc-cli.exe correct "i dont know wich langauge, teh brwon fox. THe end"
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -ne "I don't know which language, the brown fox. The end") { throw "autoc-cli failed: exit=$LASTEXITCODE out=$out" }
      - name: Packaged GUI exe writes a result (windowed exe, checks exit code and file)
        shell: pwsh
        run: |
          $p = Start-Process .\dist\AutoC\AutoC.exe -ArgumentList 'correct','"teh quick brwon fox"','--out','gui.txt' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AutoC.exe exit code $($p.ExitCode)" }
          $t = (Get-Content gui.txt -Raw).Trim()
          Write-Host $t
          if ($t -ne "The quick brown fox") { throw "AutoC.exe wrong output: $t" }
      - name: Packaged selftest (hook + SendInput)
        run: .\dist\AutoC\autoc-cli.exe selftest
      - name: Build ZIP
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./tools/make_zip.ps1
          Expand-Archive AutoC-Windows.zip -DestinationPath unzipped
          foreach ($f in 'Install.bat','Uninstall.bat','Diagnose.bat','Diagnose.ps1','Run-with-Python.bat','README.txt','AutoC\AutoC.exe','AutoC\autoc-cli.exe','source\autoc\cli.py','source\pyproject.toml') {
            if (-not (Test-Path "unzipped\$f")) { throw "ZIP is missing $f" }
          }
      - name: Install.bat
        shell: cmd
        timeout-minutes: 3
        run: |
          set "AUTOC_INSTALL_DIR=%CD%\installed dir"
          call unzipped\Install.bat
          echo install exit code: %errorlevel%
          if errorlevel 1 exit /b 1
        env:
          AUTOC_NO_PAUSE: "1"
          AUTOC_NO_START: "1"
          AUTOC_NO_GUI: "1"
      - name: Check installed files, shortcut and installed exe
        shell: pwsh
        timeout-minutes: 3
        env:
          AUTOC_NO_GUI: "1"
        run: |
          $dir = "$PWD\installed dir"
          foreach ($f in 'AutoC.exe','autoc-cli.exe') { if (-not (Test-Path "$dir\$f")) { throw "$f not installed" } }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'AutoC.lnk'
          if (-not (Test-Path $lnk)) { throw "Desktop shortcut missing" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Host "shortcut -> $target"
          if ($target -ne "$dir\AutoC.exe") { throw "wrong shortcut target" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').AutoC
          Write-Host "autostart -> $run"
          if (-not $run) { throw "autostart entry missing" }
          $out = & "$dir\autoc-cli.exe" correct "teh end"
          if ($out -ne "The end") { throw "installed exe wrong output: $out" }
      - name: Start installed AutoC.exe and keep it running 8s
        shell: pwsh
        timeout-minutes: 3
        env:
          AUTOC_NO_GUI: "1"
        run: |
          $proc = Start-Process "$PWD\installed dir\AutoC.exe" -PassThru
          Start-Sleep -Seconds 8
          $log = Join-Path $env:APPDATA 'AutoC\autoc.log'
          if (Test-Path $log) { Write-Host "--- autoc.log"; Get-Content $log }
          if ($proc.HasExited) { throw "AutoC.exe exited with $($proc.ExitCode)" }
          Write-Host "AutoC.exe is running (pid $($proc.Id))"
          Stop-Process $proc -Force
      - name: Real app test - installed AutoC.exe runs in the background and corrects real typing
        shell: pwsh
        timeout-minutes: 4
        env:
          AUTOC_NO_GUI: "1"
          AUTOC_ACCEPT_INJECTED: "1"
        run: |
          $dir = "$PWD\installed dir"
          $app = Start-Process "$dir\AutoC.exe" -ArgumentList 'run' -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "AutoC.exe run exited with $($app.ExitCode)" }
          $p = Start-Process "$dir\autoc-cli.exe" -ArgumentList 'selftest','--e2e','--external','--out','e2e-real.txt' -Wait -PassThru
          $report = Get-Content e2e-real.txt -Raw
          Write-Host $report
          $log = Join-Path $env:APPDATA 'AutoC\autoc.log'
          Write-Host "--- autoc.log"; Get-Content $log -Tail 30
          Stop-Process $app -Force
          if ($p.ExitCode -ne 0) { throw "real-app typing test failed" }
      - name: Diagnose.ps1 works
        shell: pwsh
        timeout-minutes: 3
        env:
          AUTOC_NO_PAUSE: "1"
        run: |
          $env:AUTOC_INSTALL_DIR = "$PWD\installed dir"
          powershell -NoProfile -ExecutionPolicy Bypass -File unzipped\Diagnose.ps1
          $f = Join-Path ([Environment]::GetFolderPath('Desktop')) 'AutoC-diagnose.txt'
          if (-not (Test-Path $f)) { throw "no diagnose report" }
          Get-Content $f
          if (-not (Select-String -Path $f -Pattern 'autoc-cli.exe exit code: 0' -Quiet)) { throw "diagnose could not run the program" }
      - name: Run-with-Python.bat (no .exe) installs and works
        shell: cmd
        timeout-minutes: 6
        run: |
          call unzipped\Run-with-Python.bat
          if errorlevel 1 exit /b 1
          python -m autoc correct "i dont know wich langauge"
          python -m autoc selftest
        env:
          AUTOC_NO_PAUSE: "1"
          AUTOC_NO_START: "1"
          AUTOC_NO_GUI: "1"
      - name: Uninstall.bat
        shell: cmd
        timeout-minutes: 3
        run: |
          set "AUTOC_INSTALL_DIR=%CD%\installed dir"
          call unzipped\Uninstall.bat
          if exist "%AUTOC_INSTALL_DIR%\AutoC.exe" (echo uninstall left files & exit /b 1)
        env:
          AUTOC_NO_PAUSE: "1"
          AUTOC_NO_GUI: "1"
      - uses: actions/upload-artifact@v4
        with: { name: AutoC-Windows, path: AutoC-Windows.zip }
