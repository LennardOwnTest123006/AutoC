name: CI
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" pyinstaller
      - run: python -m pytest -q
      - run: python -m autoc correct "i dont know wich langauge, teh brwon fox. THe end"
      - run: pyinstaller autoc.spec
      - run: dist\AutoC.exe correct "teh quick brwon fox"
      - uses: actions/upload-artifact@v4
        with: { name: AutoC-windows, path: dist/AutoC.exe }
