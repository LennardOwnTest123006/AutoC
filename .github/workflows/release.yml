name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.1"
        required: true
        default: "v0.1.1"
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pyinstaller
      - run: pyinstaller autoc.spec
      - name: Verify
        shell: pwsh
        run: |
          $out = & .\dist\AutoC\autoc-cli.exe correct "teh quick brwon fox"
          if ($LASTEXITCODE -ne 0 -or $out -ne "The quick brown fox") { throw "build is broken: $out" }
      - name: ZIP
        shell: pwsh
        run: ./tools/make_zip.ps1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AutoC ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: AutoC-Windows.zip
